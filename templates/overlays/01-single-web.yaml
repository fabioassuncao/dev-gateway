# ============================================================================
# One HTTP service
# ============================================================================
#   docker compose -f compose.yaml -f compose.dev-gateway.yaml up -d
#   -> http://<COMPOSE_PROJECT_NAME>-web.localhost
# ============================================================================

services:
  web:
    networks:
      - default
      - dev-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DEV_GATEWAY_NETWORK:-dev-gateway}"
      # Only needed when the image's EXPOSE does not match the port the app
      # actually listens on. It usually does not, so state it.
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-web.loadbalancer.server.port=3000"

networks:
  dev-gateway:
    external: true
    name: ${DEV_GATEWAY_NETWORK:-dev-gateway}
