name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two projects sharing one host is the whole point; two CI runs sharing one
# runner is not. Cancel superseded runs instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # The gateway itself never needs Node; its panel does, and the runner
      # already has one. The suite skips the panel when it is absent.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the panel's dependencies
        run: cd web && npm ci

      - name: Lint and unit tests
        run: ./tests/run.sh

  e2e:
    name: End-to-end (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Show runtime versions
        run: |
          docker version --format 'engine {{.Server.Version}}'
          docker compose version

      - name: Bootstrap the gateway
        run: |
          cp .env.example .env
          ./bin/dev-gateway bootstrap --yes

      - name: Start the gateway
        run: ./bin/dev-gateway up local

      - name: Build the toolbox
        run: ./bin/dev-gateway toolbox build

      - name: Doctor
        run: ./bin/dev-gateway doctor

      - name: End-to-end suites
        run: ./tests/run.sh --e2e
        env:
          DG_ASSUME_YES: "true"

      - name: Diagnostics on failure
        if: failure()
        run: |
          ./bin/dev-gateway status || true
          ./bin/dev-gateway doctor --json || true
          docker ps -a
          docker logs dev-gateway-traefik-1 --tail 100 || true
          docker logs dev-gateway-socket-proxy-1 --tail 50 || true

      - name: Tear down
        if: always()
        run: ./bin/dev-gateway down || true

  web:
    name: Web panel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: cd web && npm ci

      - name: Types
        run: cd web && npm run typecheck

      - name: OpenAPI snapshot has no drift
        run: cd web && npm run openapi:check

      - name: Unit, API and component suites
        run: cd web && npm test

      - name: Install the browser for the end-to-end run
        run: cd web && npx playwright install --with-deps chromium

      # Drives the real panel against a fake Docker Engine API, so it needs no
      # daemon and describes the same host every time.
      - name: End to end
        run: cd web && npm run test:e2e

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 5

      - name: The panel image builds
        run: docker build -t dev-gateway-web:ci web

  audit:
    name: Audit invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # No Docker needed: these are static checks on what is tracked.
      - name: Decoupling, ownership, secrets and supply chain
        run: bash tests/unit/audit.test.sh

  exposure:
    name: Exposure regression checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Bring up the default local profile
        run: |
          cp .env.example .env
          ./bin/dev-gateway bootstrap --yes --skip-pull
          ./bin/dev-gateway up local

      # A default install must never put the Docker API, the dashboard or a
      # datastore on a public interface. This job exists to make that a
      # build-breaking regression rather than something noticed in production.
      - name: Nothing sensitive is bound to 0.0.0.0
        run: |
          set -euo pipefail
          bad=$(docker ps --format '{{.Names}} {{.Ports}}' | grep '0.0.0.0' || true)
          if [ -n "$bad" ]; then
            echo "unexpected public bind in the default profile:"; echo "$bad"; exit 1
          fi
          echo "ok: no container publishes on 0.0.0.0 by default"

      - name: The socket proxy publishes no host port
        run: |
          set -euo pipefail
          ports=$(docker inspect dev-gateway-socket-proxy-1 \
            --format '{{ range $p, $c := .NetworkSettings.Ports }}{{ range $c }}{{ .HostIp }}:{{ .HostPort }} {{ end }}{{ end }}')
          [ -z "$ports" ] || { echo "socket proxy is published: $ports"; exit 1; }
          echo "ok: socket proxy is unreachable from the host"

      - name: The control network is internal
        run: |
          set -euo pipefail
          [ "$(docker network inspect dev-gateway-control --format '{{ .Internal }}')" = "true" ] \
            || { echo "control network is not internal"; exit 1; }
          echo "ok: control network is internal"

      - name: A database bridge stays on loopback
        run: |
          set -euo pipefail
          cd examples/demo-a
          docker compose -f compose.yaml -f compose.dev-gateway.yaml up -d --wait --wait-timeout 180
          cd ../..
          ./bin/dev-gateway access open --project demo-a --service postgres --quiet
          binds=$(docker ps --format '{{.Names}} {{.Ports}}' | grep '^dg-access-')
          echo "$binds"
          case "$binds" in
            *0.0.0.0*) echo "an access bridge is bound beyond loopback"; exit 1 ;;
          esac
          echo "ok: access bridges bind loopback only"
          ./bin/dev-gateway access close --all

      - name: TCP entrypoints stay on loopback, and refuse the public profile
        run: |
          set -euo pipefail
          DEV_GATEWAY_TCP=true ./bin/dev-gateway up local
          binds=$(docker ps --format '{{.Names}} {{.Ports}}' | grep dev-gateway-traefik)
          echo "$binds"
          case "$binds" in
            *0.0.0.0*) echo "a TCP entrypoint is bound beyond loopback"; exit 1 ;;
          esac
          echo "$binds" | grep -q '127.0.0.1:5432->5432' || { echo "postgres entrypoint missing"; exit 1; }
          # A database must never be reachable from the internet, so the public
          # profile refuses these entrypoints outright rather than warning.
          if DEV_GATEWAY_TCP=true PUBLIC_DOMAIN=d.test ./bin/dev-gateway up remote-public; then
            echo "remote-public accepted TCP entrypoints"; exit 1
          fi
          echo "ok: TCP entrypoints are loopback-only and refused on the public profile"
          ./bin/dev-gateway up local

      - name: The panel publishes nothing beyond loopback
        run: |
          set -euo pipefail
          ./bin/dev-gateway web up
          binds=$(docker ps --format '{{.Names}} {{.Ports}}' | grep -E 'dev-gateway-web' || true)
          echo "$binds"
          case "$binds" in
            *0.0.0.0*) echo "the panel is bound beyond loopback"; exit 1 ;;
          esac
          proxy=$(docker inspect dev-gateway-web-socket-proxy-1 \
            --format '{{ range $p, $c := .NetworkSettings.Ports }}{{ range $c }}{{ .HostIp }}:{{ .HostPort }} {{ end }}{{ end }}')
          [ -z "$proxy" ] || { echo "the panel socket proxy is published: $proxy"; exit 1; }
          curl -fsS http://127.0.0.1:8081/api/health >/dev/null
          echo "ok: the panel answers on loopback and its proxy is unreachable"
          ./bin/dev-gateway web down

      - name: Doctor agrees
        run: ./bin/dev-gateway doctor

      - name: Tear down
        if: always()
        run: |
          ./bin/dev-gateway access close --all || true
          cd examples/demo-a && docker compose -f compose.yaml -f compose.dev-gateway.yaml down -v || true
