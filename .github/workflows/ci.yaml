name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Two projects sharing one host is the whole point; two CI runs sharing one
# runner is not. Cancel superseded runs instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI runs on Linux only, on one Node. macOS and older Node are checked by hand
# with `make test` on the machine that actually has them: this is a personal
# tool, and a matrix that triples the bill to re-run identical assertions buys
# nothing here.
env:
  NODE_VERSION: '24'

jobs:
  # Everything that needs no Docker daemon of its own, once. This is the whole
  # of `tests/run.sh` (shell lint, compose parsing, the unit suites including
  # the audit invariants, and every Node workspace's suite), plus the one thing
  # it does not cover: the package npm will actually receive.
  #
  # The CLI suite is also run on its own, before the rest. `tests/run.sh` skips
  # the workspace suites when node_modules is absent, and a silent skip on a
  # runner is worse than running the fastest of them twice.
  check:
    name: Lint, types and unit suites
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    # A hung step must fail fast and leave readable logs: without this a
    # deadlocked test run sits for GitHub's six-hour default, reporting nothing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # shellcheck ships with the ubuntu-24.04 image; installing it again cost
      # an apt update on every run for a binary already on PATH.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Workspace types
        run: npm run typecheck

      # portta-core's dist as well: the contract tests and the panel's built
      # server both import the package through it, not through its sources.
      - name: Build
        run: |
          npm run build --workspace=portta-core
          npm run build --workspace=portta

      - name: CLI suite
        run: npm test --workspace=portta

      # tests/run.sh *skips* shell lint when shellcheck is absent, which on a
      # runner would be a silent loss of coverage rather than a failure.
      - name: shellcheck is present
        run: shellcheck --version

      - name: Lint and unit suites
        run: ./tests/run.sh

      - name: Entry-point smoke
        run: node packages/cli/dist/cli.js --help

      # `npx portta` and a global install are the two documented ways in, and
      # both read the packed tarball rather than the working tree. A missing
      # file or a lost shebang is invisible until someone installs it.
      - name: Pack and install exactly what npm will receive
        shell: bash
        run: |
          pack_dir="$RUNNER_TEMP/portta-pack"
          global_dir="$RUNNER_TEMP/portta-global"
          mkdir -p "$pack_dir" "$global_dir"
          tarball=$(npm pack --workspace=portta --pack-destination "$pack_dir" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')
          tar -xOf "$pack_dir/$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.name!=="portta"||p.bin?.portta!=="./dist/cli.js")process.exit(1)})'
          # Extract to a file rather than piping into head: head closes the
          # pipe on the first line, tar takes SIGPIPE, and pipefail turns that
          # into a failed step. It is a race the CLI wins only while it is
          # small enough to fit the pipe buffer.
          tar -xOf "$pack_dir/$tarball" package/dist/cli.js > "$pack_dir/cli.js"
          head -n 1 "$pack_dir/cli.js" | grep -Fx '#!/usr/bin/env node'
          npx --yes --package "$pack_dir/$tarball" -- portta | grep -F 'Usage: portta'
          npm install --global --prefix "$global_dir" "$pack_dir/$tarball"
          "$global_dir/bin/portta" --version
          "$global_dir/bin/portta" --help
          "$global_dir/bin/portta" inspect --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>JSON.parse(s))'

  # The panel's browser run and its published contract. Its types and unit
  # suites belong to `check`, which already runs them through tests/run.sh.
  # The panel image is not rebuilt here: publish.yaml builds and pushes it on
  # every branch push, so a broken Dockerfile fails there instead.
  web:
    name: Web panel (browser)
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The vitest suites resolve portta-core through its TypeScript sources,
      # so they pass without this. The Playwright web server does not: it runs
      # the *built* panel, which imports the package's `dist` and exits with
      # ERR_MODULE_NOT_FOUND before a single test starts.
      - name: Build the shared core the panel's server imports
        run: npm run build --workspace=portta-core

      - name: OpenAPI snapshot has no drift
        run: npm run openapi:check --workspace=portta-web

      - name: Install the browser
        run: npx --workspace=portta-web playwright install --with-deps chromium

      # Drives the real panel against a fake Docker Engine API, so it needs no
      # daemon and describes the same host every time.
      - name: End to end
        run: npm run test:e2e --workspace=portta-web

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 5

  e2e:
    name: End-to-end (Docker)
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the full CLI
        run: |
          npm ci
          npm run build --workspace=portta-core
          npm run build --workspace=portta

      - name: Bootstrap and start the gateway
        run: |
          cp .env.example .env
          ./bin/portta bootstrap --yes
          ./bin/portta up local
          ./bin/portta toolbox build
          ./bin/portta doctor

      - name: End-to-end suites
        run: ./tests/run.sh --e2e
        env:
          PORTTA_ASSUME_YES: "true"

      - name: Diagnostics on failure
        if: failure()
        run: |
          ./bin/portta status || true
          ./bin/portta doctor --json || true
          docker ps -a
          docker logs portta-traefik-1 --tail 100 || true
          docker logs portta-socket-proxy-1 --tail 50 || true

      - name: Tear down
        if: always()
        run: ./bin/portta down || true

  # A default install must never put the Docker API, the dashboard or a
  # datastore on a public interface. This job exists to make that a
  # build-breaking regression rather than something noticed in production.
  exposure:
    name: Exposure regression checks
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the full CLI
        run: |
          npm ci
          npm run build --workspace=portta-core
          npm run build --workspace=portta

      - name: Bring up the default local profile
        run: |
          cp .env.example .env
          ./bin/portta bootstrap --yes --skip-pull
          ./bin/portta up local

      - name: Nothing sensitive is bound to 0.0.0.0
        run: |
          set -euo pipefail
          bad=$(docker ps --format '{{.Names}} {{.Ports}}' | grep '0.0.0.0' || true)
          if [ -n "$bad" ]; then
            echo "unexpected public bind in the default profile:"; echo "$bad"; exit 1
          fi
          echo "ok: no container publishes on 0.0.0.0 by default"

      - name: The socket proxy publishes no host port
        run: |
          set -euo pipefail
          ports=$(docker inspect portta-socket-proxy-1 \
            --format '{{ range $p, $c := .NetworkSettings.Ports }}{{ range $c }}{{ .HostIp }}:{{ .HostPort }} {{ end }}{{ end }}')
          [ -z "$ports" ] || { echo "socket proxy is published: $ports"; exit 1; }
          echo "ok: socket proxy is unreachable from the host"

      - name: The control network is internal
        run: |
          set -euo pipefail
          [ "$(docker network inspect portta-control --format '{{ .Internal }}')" = "true" ] \
            || { echo "control network is not internal"; exit 1; }
          echo "ok: control network is internal"

      - name: A database bridge stays on loopback
        run: |
          set -euo pipefail
          cd docker/examples/demo-a
          docker compose -f compose.yaml -f compose.portta.yaml up -d --wait --wait-timeout 180
          cd ../../..
          ./bin/portta access open --project demo-a --service postgres --quiet
          binds=$(docker ps --format '{{.Names}} {{.Ports}}' | grep '^portta-access-')
          echo "$binds"
          case "$binds" in
            *0.0.0.0*) echo "an access bridge is bound beyond loopback"; exit 1 ;;
          esac
          echo "ok: access bridges bind loopback only"
          ./bin/portta access close --all

      - name: TCP entrypoints stay on loopback, and refuse the public profile
        run: |
          set -euo pipefail
          PORTTA_TCP=true ./bin/portta up local
          binds=$(docker ps --format '{{.Names}} {{.Ports}}' | grep portta-traefik)
          echo "$binds"
          case "$binds" in
            *0.0.0.0*) echo "a TCP entrypoint is bound beyond loopback"; exit 1 ;;
          esac
          echo "$binds" | grep -q '127.0.0.1:5432->5432' || { echo "postgres entrypoint missing"; exit 1; }
          # A database must never be reachable from the internet, so the public
          # profile refuses these entrypoints outright rather than warning.
          if PORTTA_TCP=true PUBLIC_DOMAIN=d.test ./bin/portta up remote-public; then
            echo "remote-public accepted TCP entrypoints"; exit 1
          fi
          echo "ok: TCP entrypoints are loopback-only and refused on the public profile"
          ./bin/portta up local

      - name: The panel publishes nothing beyond loopback
        run: |
          set -euo pipefail
          ./bin/portta web up
          binds=$(docker ps --format '{{.Names}} {{.Ports}}' | grep -E 'portta-web' || true)
          echo "$binds"
          case "$binds" in
            *0.0.0.0*) echo "the panel is bound beyond loopback"; exit 1 ;;
          esac
          proxy=$(docker inspect portta-web-socket-proxy-1 \
            --format '{{ range $p, $c := .NetworkSettings.Ports }}{{ range $c }}{{ .HostIp }}:{{ .HostPort }} {{ end }}{{ end }}')
          [ -z "$proxy" ] || { echo "the panel socket proxy is published: $proxy"; exit 1; }
          curl -fsS http://127.0.0.1:8081/api/health >/dev/null
          echo "ok: the panel answers on loopback and its proxy is unreachable"
          ./bin/portta web down

      - name: Doctor agrees
        run: ./bin/portta doctor

      - name: Tear down
        if: always()
        run: |
          ./bin/portta access close --all || true
          cd docker/examples/demo-a && docker compose -f compose.yaml -f compose.portta.yaml down -v || true

  published-cli:
    name: Published CLI smoke
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install from the public registry
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          npm install --global "portta@$version"
          portta --version | grep -F "$version"
