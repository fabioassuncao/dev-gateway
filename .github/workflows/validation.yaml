name: Validate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PORTTA_CI_RELEASE: ${{ inputs.release || false }}
      PORTTA_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - id: scope
        run: node tests/ci.mjs --scope
      - name: Documentation links
        if: steps.scope.outputs.code != 'true'
        run: bash tests/lint-links.sh
      - name: Install
        if: steps.scope.outputs.code == 'true'
        run: npm ci
      - name: Static tool prerequisites
        if: steps.scope.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          echo '9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  '"$RUNNER_TEMP/cloudflared" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
      - name: Integration
        if: steps.scope.outputs.code == 'true'
        run: npm run test:integration
      - name: Browser prerequisites
        if: steps.scope.outputs.browser == 'true'
        run: npx --workspace=portta-web playwright install --with-deps chromium
      - name: Affected E2E or release regression
        if: steps.scope.outputs.code == 'true'
        run: node tests/ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            test-results/
            apps/web/test-results/
          if-no-files-found: ignore
