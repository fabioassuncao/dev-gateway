# ============================================================================
# demo-shop: Portta integration overlay
# ============================================================================
# Routes every HTTP surface: web, api, Mailpit UI, RustFS console. Datastores,
# the worker and the S3 API stay on the project network only.
#
#   docker compose -f compose.yaml -f compose.portta.yaml up -d
#   -> http://demo-shop-web.localhost
#   -> http://demo-shop-api.localhost
#   -> http://demo-shop-mailpit.localhost
#   -> http://demo-shop-rustfs.localhost/rustfs/console/  (console UI)
#   -> rustfs:9000 on the project network (S3 API, private)
# ============================================================================

services:
  web:
    networks:
      - default
      - portta
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-shop}-web.loadbalancer.server.port=3000"

  api:
    networks:
      - default
      - portta
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-shop}-api.loadbalancer.server.port=8000"

  mailpit:
    networks:
      - default
      - portta
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-shop}-mailpit.loadbalancer.server.port=8025"

  rustfs:
    networks:
      - default
      - portta
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      # Console only. The S3 API on 9000 stays reachable as rustfs:9000 on
      # the project network; it is not published through Traefik.
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-shop}-rustfs.loadbalancer.server.port=9001"

  # worker, mysql and redis are absent on purpose: no HTTP to route.

networks:
  portta:
    external: true
    name: ${PORTTA_NETWORK:-portta}
