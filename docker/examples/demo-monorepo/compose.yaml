# ============================================================================
# demo-monorepo: apps/ and services/ in one Compose project
# ============================================================================
# One namespace, several apps, a worker without HTTP, plus the usual private
# infrastructure. The gateway does not care about the directory layout: it
# only sees Compose service names and labels.
#
# Layout (illustrative; images are used directly, no Dockerfiles required):
#   apps/web/          -> web
#   apps/admin/        -> admin
#   services/api/      -> api
#   services/worker/   -> worker (no HTTP)
#
# Run it on its own:      docker compose up -d
# Run it on the gateway:  docker compose -f compose.yaml -f compose.portta.yaml up -d
# ============================================================================

name: ${COMPOSE_PROJECT_NAME:-demo-monorepo}

services:
  web:
    image: nginx:1.31.4-alpine
    restart: unless-stopped
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5

  admin:
    image: traefik/whoami:v1.12.0
    command: ["--port", "3000", "--name", "demo-monorepo-admin"]
    restart: unless-stopped

  api:
    image: traefik/whoami:v1.12.0
    command: ["--port", "8000", "--name", "demo-monorepo-api"]
    restart: unless-stopped

  worker:
    image: node:24.20.0-alpine
    command: ["sh", "-c", "while true; do echo demo-monorepo-worker tick; sleep 30; done"]
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory and
      # refuse to start when .../data is mounted directly. Mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
