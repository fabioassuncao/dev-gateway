# ============================================================================
# demo-monorepo: Portta integration overlay
# ============================================================================
# Routes web, admin, api and the Mailpit UI. Worker, postgres and redis stay
# on the project network only.
#
#   -> http://demo-monorepo-web.localhost
#   -> http://demo-monorepo-admin.localhost
#   -> http://demo-monorepo-api.localhost
#   -> http://demo-monorepo-mailpit.localhost
#
# It also declares the optional identity labels, because a monorepo is where
# they earn their keep: the panel cannot infer a repository from a directory
# name. Delete them and everything still works; nothing depends on them.
# ============================================================================

services:
  web:
    networks:
      - default
      - portta
    labels:
      - "portta.repo=fabioassuncao/portta"
      - "portta.git.root=/srv/dev/demo-monorepo"
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-monorepo}-web.loadbalancer.server.port=3000"

  admin:
    networks:
      - default
      - portta
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-monorepo}-admin.loadbalancer.server.port=3000"

  api:
    networks:
      - default
      - portta
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-monorepo}-api.loadbalancer.server.port=8000"

  mailpit:
    networks:
      - default
      - portta
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-monorepo}-mailpit.loadbalancer.server.port=8025"

networks:
  portta:
    external: true
    name: ${PORTTA_NETWORK:-portta}
