# ============================================================================
# demo-site: Portta integration overlay
# ============================================================================
# One HTTP service. Labels use the LIST form so Compose interpolates
# ${COMPOSE_PROJECT_NAME} inside the Traefik service name.
#
#   docker compose -f compose.yaml -f compose.portta.yaml up -d
#   -> http://demo-site-web.localhost
# ============================================================================

services:
  web:
    networks:
      - default
      - portta
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PORTTA_NETWORK:-portta}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-demo-site}-web.loadbalancer.server.port=3000"

networks:
  portta:
    external: true
    name: ${PORTTA_NETWORK:-portta}
