# ============================================================================
# demo-b: a second, unrelated project
# ============================================================================
# Uses the SAME internal ports as demo-a (3000 and 8000) and its own Postgres
# on 5432 and Redis on 6379. Both stacks run at once with no host-port
# conflict, because none of them publishes a host port at all.
#
# Different images from demo-a on purpose: the gateway contract is about
# networks and labels, not about a particular stack.
# ============================================================================

name: ${COMPOSE_PROJECT_NAME:-demo-b}

services:
  # nginx serving a static page, also on internal port 3000.
  web:
    image: nginx:1.31.4-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: traefik/whoami:v1.12.0
    command: ["--port", "8000", "--name", "demo-b-api"]
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory and
      # refuse to start when .../data is mounted directly. Mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
