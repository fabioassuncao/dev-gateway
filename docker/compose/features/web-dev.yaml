# ============================================================================
# Portta: panel in development mode
# ============================================================================
# Applied when PORTTA_WEB_DEV=true, or by `portta web dev`.
#
# Two containers from the same image: the API with `node --watch`, and Vite
# with HMR in front of it. Only source directories are bind-mounted, so the
# image's node_modules stay in place and the host never needs Node installed.
# ============================================================================

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    image: fabioassuncao/portta:dev
    # The package script, never a restated command line: it carries
    # `--conditions=development`, without which portta-core resolves to a
    # dist/ the dev image does not build.
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web/src:/app/apps/web/src
      # SQL files the running process reads on the next migrate. Without this
      # a new file stays in the image until the next rebuild, so `portta db
      # migrate` and a panel restart would both see a stale set.
      - ./apps/web/migrations:/app/apps/web/migrations
      # The shared package, so editing it reloads the panel like its own source.
      - ./packages/core/src:/app/packages/core/src
      - ./.env:/app/state/.env
      - ./VERSION:/app/state/VERSION:ro

  web-ui:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    image: fabioassuncao/portta:dev
    restart: unless-stopped
    depends_on:
      - web
    # `node`, never PORTTA_WEB_USER. That override exists so the API container
    # can write the host's .env; Vite writes no host file at all, and does write
    # inside the image (node_modules/.vite/{ui,docs}), which only `node` owns.
    # Each Vite has its own cacheDir: a shared deps/ would make one process
    # delete the other's pre-bundle (504 Outdated Optimize Dep).
    user: node
    command: ["npm", "run", "dev:ui"]
    environment:
      NODE_ENV: development
      # Vite proxies /api to the API container beside it. /docs is the
      # documentation Vite on loopback :5174, started by the same command.
      PORTTA_RUNTIME_API_TARGET: http://web:8081
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/package.json:/app/apps/web/package.json:ro
      - ./apps/web/scripts:/app/apps/web/scripts:ro
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
      - ./apps/web/vite.docs.config.ts:/app/apps/web/vite.docs.config.ts:ro
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json:ro
      # The documentation Vite reads these at request time, the same set the
      # production image bakes in. Without them /docs would collect nothing.
      - ./docs:/app/docs:ro
      - ./README.md:/app/README.md:ro
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
    networks:
      # The shared network, not the panel's control network: a container
      # attached only to an `internal` network cannot publish a host port, and
      # Vite has no business reaching the socket proxy anyway. It finds the API
      # at `web:8081` here just as well.
      - gateway
    ports:
      - "${PORTTA_WEB_BIND_ADDRESS:-127.0.0.1}:${PORTTA_WEB_DEV_PORT:-5173}:5173"
    labels:
      traefik.enable: "false"
      portta.managed: "true"
      portta.component: web-ui
