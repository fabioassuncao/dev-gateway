# ============================================================================
# Dev Gateway: panel in development mode
# ============================================================================
# Applied when DEV_GATEWAY_WEB_DEV=true, or by `dev-gateway web dev`.
#
# Two containers from the same image: the API with `node --watch`, and Vite
# with HMR in front of it. Only source directories are bind-mounted, so the
# image's node_modules stay in place and the host never needs Node installed.
# ============================================================================

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    image: dev-gateway-web:dev
    # The package script, never a restated command line: it carries
    # `--conditions=development`, without which @dev-gateway/core resolves to a
    # dist/ the dev image does not build.
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web/src:/app/apps/web/src
      # The shared package, so editing it reloads the panel like its own source.
      - ./packages/core/src:/app/packages/core/src
      - ./.env:/app/state/.env
      - ./VERSION:/app/state/VERSION:ro

  web-ui:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    image: dev-gateway-web:dev
    restart: unless-stopped
    depends_on:
      - web
    user: ${DEV_GATEWAY_WEB_USER:-node}
    command: ["npm", "run", "dev:ui"]
    environment:
      NODE_ENV: development
      # Vite proxies /api to the API container beside it.
      DG_WEB_API_TARGET: http://web:8081
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json:ro
    networks:
      # The shared network, not the panel's control network: a container
      # attached only to an `internal` network cannot publish a host port, and
      # Vite has no business reaching the socket proxy anyway. It finds the API
      # at `web:8081` here just as well.
      - gateway
    ports:
      - "${DEV_GATEWAY_WEB_BIND_ADDRESS:-127.0.0.1}:${DEV_GATEWAY_WEB_DEV_PORT:-5173}:5173"
    labels:
      traefik.enable: "false"
      dev-gateway.managed: "true"
      dev-gateway.component: web-ui
