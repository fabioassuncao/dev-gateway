# ============================================================================
# Portta: build the auth image locally (checkout only)
# ============================================================================
# Applied when PORTTA_WEB_BUILD or PORTTA_WEB_DEV is true, and whenever the
# checkout still has apps/auth. An installed PORTTA_HOME has no application
# source and keeps pulling the published image.
#
# The runtime target is what `portta up` migrates and what the long-running
# service executes: /app/apps/auth/dist/migrate.js and index.js.
# See docs/adr/0020-installer-and-portta-home.md.
# ============================================================================

services:
  portta-auth:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: ${PORTTA_AUTH_IMAGE:-fabioassuncao/portta:local}

  portta-auth-migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: ${PORTTA_AUTH_IMAGE:-fabioassuncao/portta:local}
