# ============================================================================
# Portta: panel persistence (opt-in with the panel)
# ============================================================================
# PostgreSQL is a private implementation detail of the panel. It has no host
# port, never joins the shared HTTP network, and keeps its data in a named
# volume that `portta down` does not remove.
# ============================================================================

networks:
  webdata:
    name: ${PORTTA_DB_NETWORK:-portta-data}
    internal: true
    labels:
      portta.managed: "true"
      portta.component: data-network

volumes:
  portta-db:
    name: ${PORTTA_DB_VOLUME:-portta-db}
    labels:
      portta.managed: "true"
      portta.component: db-volume

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portta
      POSTGRES_USER: portta
      # An empty value makes PostgreSQL refuse to initialise; it never makes it
      # trust unauthenticated clients. bootstrap/web up normally fill this.
      POSTGRES_PASSWORD: ${PORTTA_RUNTIME_DB_PASSWORD:-}
    volumes:
      # PostgreSQL 18+ stores data in a major-version subdirectory. Mount the
      # parent so upgrades fail explicitly instead of creating nested data.
      - portta-db:/var/lib/postgresql
    networks:
      - webdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portta -d portta"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    labels:
      traefik.enable: "false"
      portta.managed: "true"
      portta.component: db
    # No `ports:`. Only the panel can reach this service.

  web:
    environment:
      PORTTA_RUNTIME_DATABASE_URL: ${PORTTA_RUNTIME_DATABASE_URL:-postgres://portta:${PORTTA_RUNTIME_DB_PASSWORD}@db:5432/portta}
      PORTTA_DB_NETWORK: ${PORTTA_DB_NETWORK:-portta-data}
    networks:
      - webdata
